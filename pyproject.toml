[project]
name = "spa-backend-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "SQLAlchemy>=2.1.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.15.1",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/modulos/*/api/router.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integracion: requiere PostgreSQL/PostGIS (docker compose up db)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if TYPE_CHECKING:",
]
