openapi: 3.1.0
info:
  title: S1 · Identidad · Spa de Uñas
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /auth/login:
    post:
      tags:
      - identidad
      summary: Iniciar sesión
      description: Público · HU-01
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSalida'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /auth/recuperar:
    post:
      tags:
      - identidad
      summary: Solicitar recuperación de contraseña
      description: Público · Supabase Auth envía el correo. Responde 202 aunque el correo no exista (no revela cuentas)
      operationId: recuperar_contrasena
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarEntrada'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /auth/me:
    get:
      tags:
      - identidad
      summary: 'Sesión actual: perfil, rol y permisos'
      description: Autenticado · HU-01, RNF-07
      operationId: sesion_actual
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioSesion'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      security:
      - HTTPBearer: []
  /usuarios:
    get:
      tags:
      - identidad
      summary: Listar usuarios
      description: usuario.gestionar · HU-09
      operationId: listar_usuarios
      security:
      - HTTPBearer: []
      parameters:
      - name: activo
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Activo
      - name: rol
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CodigoRol'
          - type: 'null'
          title: Rol
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, desde 1
          default: 1
          title: Page
        description: Página, desde 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, máximo 100
          default: 20
          title: Size
        description: Tamaño de página, máximo 100
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_Usuario_'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
    post:
      tags:
      - identidad
      summary: Crear usuario
      description: usuario.gestionar · HU-09, RF-13
      operationId: crear_usuario
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '409':
          description: Conflicto de regla de negocio (ver `code`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /usuarios/{usuario_id}:
    get:
      tags:
      - identidad
      summary: Consultar usuario
      description: usuario.gestionar · HU-09
      operationId: obtener_usuario
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Usuario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          description: RECURSO_NO_EXISTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
    patch:
      tags:
      - identidad
      summary: Cambiar nombre o rol
      description: usuario.gestionar · HU-09
      operationId: actualizar_usuario
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          description: RECURSO_NO_EXISTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /usuarios/{usuario_id}/estado:
    patch:
      tags:
      - identidad
      summary: Activar o desactivar (no existe DELETE)
      description: usuario.gestionar · HU-09
      operationId: cambiar_estado_usuario
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEstado'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          description: RECURSO_NO_EXISTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /roles:
    get:
      tags:
      - identidad
      summary: Roles con sus permisos
      description: usuario.gestionar · RF-01
      operationId: listar_roles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rol'
                type: array
                title: Response Listar Roles
        '401':
          description: 'NO_AUTENTICADO: falta el token o está vencido'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: 'SIN_PERMISO: el rol no tiene el permiso del endpoint'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: 'DATOS_INVALIDOS: campos faltantes o fuera de regla'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '501':
          description: 'NO_IMPLEMENTADO: definido en el contrato, pendiente de implementar'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      security:
      - HTTPBearer: []
components:
  schemas:
    CodigoRol:
      type: string
      enum:
      - ADMINISTRADOR
      - MANICURISTA
      - GERENTE
      title: CodigoRol
    ErrorCampo:
      properties:
        campo:
          title: Campo
          type: string
        mensaje:
          title: Mensaje
          type: string
      required:
      - campo
      - mensaje
      title: ErrorCampo
      type: object
    LoginEntrada:
      properties:
        correo:
          type: string
          maxLength: 255
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Correo
          examples:
          - admin@spa.co
        contrasena:
          type: string
          maxLength: 128
          minLength: 8
          title: Contrasena
      type: object
      required:
      - correo
      - contrasena
      title: LoginEntrada
    LoginSalida:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: Segundos de vigencia del token
        usuario:
          $ref: '#/components/schemas/UsuarioSesion'
      type: object
      required:
      - access_token
      - expires_in
      - usuario
      title: LoginSalida
    Mensaje:
      properties:
        mensaje:
          type: string
          title: Mensaje
      type: object
      required:
      - mensaje
      title: Mensaje
    Pagina_Usuario_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Usuario'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: Pagina[Usuario]
    Problema:
      description: Cuerpo `application/problem+json` (RFC 9457) con `code` estable.
      properties:
        type:
          title: Type
          type: string
        title:
          title: Title
          type: string
        status:
          title: Status
          type: integer
        detail:
          title: Detail
          type: string
        code:
          examples:
          - SIN_PERMISO
          title: Code
          type: string
        errors:
          default: []
          items:
            $ref: '#/components/schemas/ErrorCampo'
          title: Errors
          type: array
      required:
      - type
      - title
      - status
      - detail
      - code
      title: Problema
      type: object
    RecuperarEntrada:
      properties:
        correo:
          type: string
          maxLength: 255
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Correo
          examples:
          - admin@spa.co
      type: object
      required:
      - correo
      title: RecuperarEntrada
    Rol:
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoRol'
        nombre:
          type: string
          title: Nombre
        permisos:
          items:
            type: string
          type: array
          title: Permisos
      type: object
      required:
      - codigo
      - nombre
      - permisos
      title: Rol
    Usuario:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        correo:
          type: string
          title: Correo
        nombre_completo:
          type: string
          title: Nombre Completo
        rol:
          $ref: '#/components/schemas/CodigoRol'
        activo:
          type: boolean
          title: Activo
        creado_en:
          type: string
          format: date-time
          title: Creado En
      type: object
      required:
      - id
      - correo
      - nombre_completo
      - rol
      - activo
      - creado_en
      title: Usuario
    UsuarioActualizar:
      properties:
        nombre_completo:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 3
          - type: 'null'
          title: Nombre Completo
        rol:
          anyOf:
          - $ref: '#/components/schemas/CodigoRol'
          - type: 'null'
      type: object
      title: UsuarioActualizar
    UsuarioCrear:
      properties:
        correo:
          type: string
          maxLength: 255
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Correo
          examples:
          - admin@spa.co
        nombre_completo:
          type: string
          maxLength: 120
          minLength: 3
          title: Nombre Completo
        rol:
          $ref: '#/components/schemas/CodigoRol'
        contrasena_temporal:
          type: string
          maxLength: 128
          minLength: 8
          title: Contrasena Temporal
      type: object
      required:
      - correo
      - nombre_completo
      - rol
      - contrasena_temporal
      title: UsuarioCrear
    UsuarioEstado:
      properties:
        activo:
          type: boolean
          title: Activo
      type: object
      required:
      - activo
      title: UsuarioEstado
    UsuarioSesion:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        correo:
          type: string
          title: Correo
        nombre_completo:
          type: string
          title: Nombre Completo
        rol:
          $ref: '#/components/schemas/CodigoRol'
        permisos:
          items:
            type: string
          type: array
          title: Permisos
      type: object
      required:
      - id
      - correo
      - nombre_completo
      - rol
      - permisos
      title: UsuarioSesion
  securitySchemes:
    HTTPBearer:
      type: http
      description: JWT emitido por POST /api/v1/auth/login
      scheme: bearer
