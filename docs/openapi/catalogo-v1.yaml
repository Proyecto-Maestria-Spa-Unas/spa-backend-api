components:
  schemas:
    Categoria:
      properties:
        id:
          type: integer
          title: Id
        nombre:
          type: string
          title: Nombre
        descripcion:
          anyOf:
          - type: string
          - type: 'null'
          title: Descripcion
        orden:
          type: integer
          title: Orden
          default: 0
        activa:
          type: boolean
          title: Activa
          default: true
      type: object
      required:
      - id
      - nombre
      title: Categoria
    CategoriaActualizar:
      properties:
        nombre:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 2
          - type: 'null'
          title: Nombre
        descripcion:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Descripcion
        orden:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Orden
        activa:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Activa
      type: object
      title: CategoriaActualizar
    CategoriaCrear:
      properties:
        nombre:
          type: string
          maxLength: 80
